<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">

<head>
    <meta charset="UTF-8">

<body class="d-flex flex-column min-vh-100">

    <header class="bg-dark bg-gradient text-white py-4 shadow-sm sticky-top">
        <div class="container d-flex align-items-center gap-4">

            <a class="texto text-decoration-none" href="../index.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor"
                    class="bi bi-book-half" viewBox="0 0 16 16">
                    <path
                        d="M8.5 2.687c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783" />

            <ul class="nav gap-3 ms-auto">
                <li class="nav-item"><a href="" class="nav-link">Livros</a></li>
                <li class="nav-item"><a href="" class="nav-link">Revistas</a></li>
            </ul>
        </div>
    </header>
    <main class="container d-flex align-items-center justify-content-center flex-grow-1">
        <section class="card" style="max-width: 320px">
            <div class="card-body p-10">
                <h4 class="card-title fp">Exibir tudo</h4>
                <p class="card-text fp">Clique no botão abaixo para exibir tudo</p>
                <button id="buscar" class="btn-solid theme-primary" >Exibir</button>
                <div id="_status" class="alert d-none mt-3" role="status">
                </div>
            </div>

            <div class="bg-dark mt-10">
                <pre id="saida" class="bg-black text-white small rounded p-3 mt-3 m-2">Clique para iniciar.</pre>
            </div>

        </section>





    </main>
    <footer class="bg-muted-inverse text-white text-center py-3 mt-auto">
        <small>&copy; 2026 Biblioteca S. Grêmio</small>
    </footer>

    <script src="js/exibir_tudo.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
